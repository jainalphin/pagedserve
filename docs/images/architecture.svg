<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">PagedServe system architecture</title>
  <desc id="desc">Requests pass through tokenization and continuous batch scheduling into the model, which exchanges data with paged attention and a shared KV cache before generated tokens are returned.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#eef3ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1d3557" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4263eb"/>
    </marker>
    <style>
      .title{font:700 34px Inter,Arial,sans-serif;fill:#132238}.subtitle{font:400 17px Inter,Arial,sans-serif;fill:#52637a}
      .label{font:700 19px Inter,Arial,sans-serif;fill:#132238}.detail{font:400 15px Inter,Arial,sans-serif;fill:#52637a}
      .arrow{stroke:#4263eb;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#background)"/>
  <text x="60" y="65" class="title">How one PagedServe iteration works</text>
  <text x="60" y="96" class="subtitle">New prompts and active decodes share the model while cache blocks remain request-aware.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="165" width="190" height="130" rx="20" fill="#ffffff" stroke="#bed0f7" stroke-width="2"/>
    <rect x="285" y="165" width="230" height="130" rx="20" fill="#ffffff" stroke="#bed0f7" stroke-width="2"/>
    <rect x="555" y="145" width="260" height="170" rx="20" fill="#dbe8ff" stroke="#4263eb" stroke-width="3"/>
    <rect x="855" y="165" width="290" height="130" rx="20" fill="#ffffff" stroke="#bed0f7" stroke-width="2"/>
  </g>

  <text x="150" y="205" text-anchor="middle" class="label">Requests</text>
  <text x="150" y="236" text-anchor="middle" class="detail">prompts arrive</text>
  <text x="150" y="260" text-anchor="middle" class="detail">at different times</text>

  <text x="400" y="205" text-anchor="middle" class="label">Tokenizer</text>
  <text x="400" y="236" text-anchor="middle" class="detail">text → token IDs</text>
  <text x="400" y="260" text-anchor="middle" class="detail">context-limit check</text>

  <text x="685" y="190" text-anchor="middle" class="label">Continuous scheduler</text>
  <text x="685" y="224" text-anchor="middle" class="detail">waiting + active requests</text>
  <rect x="590" y="248" width="83" height="38" rx="10" fill="#ffffff"/>
  <rect x="682" y="248" width="98" height="38" rx="10" fill="#ffffff"/>
  <text x="631" y="273" text-anchor="middle" class="detail">prefill</text>
  <text x="731" y="273" text-anchor="middle" class="detail">decode × 1</text>

  <text x="1000" y="205" text-anchor="middle" class="label">Transformer</text>
  <text x="1000" y="236" text-anchor="middle" class="detail">one flattened batch</text>
  <text x="1000" y="260" text-anchor="middle" class="detail">next-token logits</text>

  <path d="M245 230 H276" class="arrow"/>
  <path d="M515 230 H546" class="arrow"/>
  <path d="M815 230 H846" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="555" y="400" width="260" height="135" rx="20" fill="#fff4df" stroke="#f09a32" stroke-width="2"/>
    <rect x="855" y="400" width="290" height="135" rx="20" fill="#e8f8f0" stroke="#2f9e6f" stroke-width="2"/>
    <rect x="55" y="400" width="460" height="135" rx="20" fill="#ffffff" stroke="#bed0f7" stroke-width="2"/>
  </g>

  <text x="685" y="442" text-anchor="middle" class="label">Paged attention</text>
  <text x="685" y="474" text-anchor="middle" class="detail">follows each block table</text>
  <text x="685" y="498" text-anchor="middle" class="detail">reads valid K/V positions</text>

  <text x="1000" y="442" text-anchor="middle" class="label">Shared KV block pool</text>
  <text x="1000" y="474" text-anchor="middle" class="detail">fixed 16-token blocks</text>
  <text x="1000" y="498" text-anchor="middle" class="detail">allocate · reuse · release</text>

  <text x="285" y="442" text-anchor="middle" class="label">Generated tokens</text>
  <text x="285" y="474" text-anchor="middle" class="detail">argmax result routed by request ID</text>
  <text x="285" y="498" text-anchor="middle" class="detail">finished requests leave immediately</text>

  <path d="M940 295 C940 342 800 344 760 392" class="arrow"/>
  <path d="M815 468 H846" class="arrow"/>
  <path d="M855 505 C820 570 560 575 510 508" class="arrow"/>
</svg>
